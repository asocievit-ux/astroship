        UILaunchScreen:
          UIColorName: LaunchBackground
        UIStatusBarStyle: UIStatusBarStyleLightContent
        UIRequiresFullScreen: false
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.aihasakuramoto22.solarmotion
        PRODUCT_NAME: AstroShip
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SWIFT_STRICT_CONCURRENCY: minimal
      configs:
        # Debug: Google's test app ID. Release: AstroShip's AdMob app. See Sources/App/AdConfig.swift.
        Debug:
          GAD_APPLICATION_ID: "ca-app-pub-3940256099942544~1458002511"
        Release:
          GAD_APPLICATION_ID: "ca-app-pub-7991339056188042~2002874937"

  # Native Apple Vision Pro app. Same bundle ID as the iOS app (universal purchase), no ads SDK.
  AstroShipVision:
    type: application
    platform: visionOS
    dependencies:
      - package: AstroCore
    sources:
      - path: Sources/App
      - path: Resources/VisionAssets.xcassets
      - path: Resources/Localization
      - path: Resources/PrivacyInfo.xcprivacy
        buildPhase: resources
      - path: Resources/Textures
        type: folder
        buildPhase: resources
      - path: Resources/Data
        type: folder
        buildPhase: resources
      - path: Resources/Audio
        type: folder
        buildPhase: resources
      - path: Resources/Thumbs
        type: folder
        buildPhase: resources
    info:
      path: Generated/AstroShipVision-Info.plist
      properties:
        CFBundleDisplayName: "AstroShip"
        CFBundleName: "AstroShip"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations: [en, ja, zh-Hans, es, pt, fr, de, tl, ru, sv, he]
        ITSAppUsesNonExemptEncryption: false
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
          UIApplicationPreferredDefaultSceneSessionRole: UIWindowSceneSessionRoleApplication
          UISceneConfigurations: {}
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.aihasakuramoto22.solarmotion
        PRODUCT_NAME: AstroShip
        TARGETED_DEVICE_FAMILY: "7"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SWIFT_STRICT_CONCURRENCY: minimal

schemes:
  AstroShip:
    build: { targets: { AstroShip: all } }
    run:
      config: Debug
      storeKitConfiguration: AstroShip.storekit
    test:
      config: Debug
    archive: { config: Release }
  AstroShipVision:
    build: { targets: { AstroShipVision: all } }
    run:
      config: Debug
    archive: { config: Release }
