# XcodeGen spec:  xcodegen generate  -> AstroShip.xcodeproj
# AstroShip (App Store name "AstroShip: Bon Voyage"). Team 633T9MRH99.
# Bundle ID com.aihasakuramoto22.solarmotion was registered before the name was chosen; it is kept.
# The shared engine lives in the AstroCore Swift package (Package.swift) so a visionOS target can be added later.
name: AstroShip
options:
  bundleIdPrefix: com.aihasakuramoto22
  deploymentTarget: { iOS: "17.0", visionOS: "2.0" }
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1,2"
    DEVELOPMENT_TEAM: "633T9MRH99"
    CODE_SIGN_STYLE: Automatic
packages:
  AstroCore: { path: . }
  GoogleMobileAds:
    url: https://github.com/googleads/swift-package-manager-google-mobile-ads.git
    exactVersion: "13.12.0"
  GoogleUserMessagingPlatform:
    url: https://github.com/googleads/swift-package-manager-google-user-messaging-platform.git
    exactVersion: "2.7.0"

targets:
  AstroShip:
    type: application
    platform: iOS
    dependencies:
      - package: AstroCore
      - package: GoogleMobileAds
        product: GoogleMobileAds
      - package: GoogleUserMessagingPlatform
        product: GoogleUserMessagingPlatform
    sources:
      - path: Sources/App
      - path: Resources/Assets.xcassets
      - path: Resources/Localization
      - path: Resources/PrivacyInfo.xcprivacy
        buildPhase: resources
      - path: Resources/Textures
        type: folder
        buildPhase: resources
      - path: Resources/Data
        type: folder
        buildPhase: resources
      - path: Resources/Audio
        type: folder
        buildPhase: resources
      - path: Resources/Thumbs
        type: folder
        buildPhase: resources
    info:
      path: Generated/AstroShip-Info.plist
      properties:
        CFBundleDisplayName: "AstroShip"
        CFBundleName: "AstroShip"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations: [en, ja, zh-Hans, es, pt, fr, de, tl, ru, sv, he]
        ITSAppUsesNonExemptEncryption: false
        GADApplicationIdentifier: "$(GAD_APPLICATION_ID)"
        NSUserTrackingUsageDescription: "Your choice lets AstroShip show ads that are more relevant to you. The app works the same either way."
        # Google + third-party buyers, from developers.google.com/admob/ios/quick-start (same 50 as the Bible app).
        SKAdNetworkItems:
          - SKAdNetworkIdentifier: cstr6suwn9.skadnetwork
          - SKAdNetworkIdentifier: 4fzdc2evr5.skadnetwork
          - SKAdNetworkIdentifier: 2fnua5tdw4.skadnetwork
