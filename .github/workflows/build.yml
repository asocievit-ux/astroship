# Manual only. Unit tests for AstroCore, a simulator build, and simulator screenshots.
# No signing, no upload.
name: Build & screenshots
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: astroship-build
  cancel-in-progress: true
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: |
          set -euo pipefail
          X=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1 || true)
          [ -n "$X" ] || X=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          sudo xcode-select -s "$X"
          xcodebuild -version
      - name: AstroCore unit tests
        run: |
          set -o pipefail
          swift test 2>&1 | tail -80
      - name: Generate project
        run: brew install xcodegen && xcodegen generate
      - name: Build for simulator
        run: |
          set -euo pipefail
          set +e
          xcodebuild -project AstroShip.xcodeproj -scheme AstroShip -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/dd" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build > "$RUNNER_TEMP/build.log" 2>&1
          code=$?
          set -e
          grep -E "error:|warning:.*Sources/" "$RUNNER_TEMP/build.log" | sort -u | head -150 || true
          tail -5 "$RUNNER_TEMP/build.log"
          exit $code
      - name: Screenshots
        run: |
          set -euo pipefail
          APP=$(find "$RUNNER_TEMP/dd/Build/Products" -name 'AstroShip.app' -path '*iphonesimulator*' | head -1)
          mkdir -p "$RUNNER_TEMP/shots"
          pick() {
            xcrun simctl list devices available -j | python3 -c "
          import json,sys,re
          want=sys.argv[1]
          d=json.load(sys.stdin)['devices']
          best=None
          for rt,devs in d.items():
              if 'iOS' not in rt: continue
              for dev in devs:
                  if re.search(want, dev['name']) and dev.get('isAvailable'):
                      best=(rt,dev['udid'],dev['name'])
          print(best[1] if best else '')
          " "$1"
          }
          shoot() {
            UDID="$1"; TAG="$2"
            xcrun simctl boot "$UDID" || true
            xcrun simctl bootstatus "$UDID" -b
            xcrun simctl install "$UDID" "$APP"
            xcrun simctl status_bar "$UDID" override --time "9:41" --batteryState charged --batteryLevel 100 || true
            for SHOT in earth saturn inner galactic galaxy; do
              xcrun simctl terminate "$UDID" com.aihasakuramoto22.solarmotion 2>/dev/null || true
              xcrun simctl launch "$UDID" com.aihasakuramoto22.solarmotion -shot "$SHOT" -AppleLanguages "(ja)" -AppleLocale ja_JP
              sleep 14
              xcrun simctl io "$UDID" screenshot "$RUNNER_TEMP/shots/${TAG}-${SHOT}.png"
            done
            xcrun simctl terminate "$UDID" com.aihasakuramoto22.solarmotion 2>/dev/null || true
            xcrun simctl launch "$UDID" com.aihasakuramoto22.solarmotion -shot earth -AppleLanguages "(en)" -AppleLocale en_US
            sleep 12
            xcrun simctl io "$UDID" screenshot "$RUNNER_TEMP/shots/${TAG}-earth-en.png"
            xcrun simctl terminate "$UDID" com.aihasakuramoto22.solarmotion 2>/dev/null || true
            xcrun simctl launch "$UDID" com.aihasakuramoto22.solarmotion -shot galactic -AppleLanguages "(he)" -AppleLocale he_IL
            sleep 12
            xcrun simctl io "$UDID" screenshot "$RUNNER_TEMP/shots/${TAG}-galactic-he.png"
            xcrun simctl shutdown "$UDID" || true
          }
          IPHONE=$(pick 'iPhone .*Pro$')
          [ -n "$IPHONE" ] || IPHONE=$(pick 'iPhone')
          shoot "$IPHONE" iphone
          IPAD=$(pick 'iPad Pro.*13')
          [ -n "$IPAD" ] || IPAD=$(pick 'iPad')
          shoot "$IPAD" ipad
          ls -la "$RUNNER_TEMP/shots"
          # crash reports, if any
          ls ~/Library/Logs/DiagnosticReports/ 2>/dev/null | grep -i astro && head -120 ~/Library/Logs/DiagnosticReports/*Astro* || true
      - uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: ${{ runner.temp }}/shots
          retention-days: 7
